# Kapital Production Deployment
# 챕터 5.6: 자동 배포 파이프라인 (Vercel)
#
# main 브랜치에 푸시 시 검증 후 자동 배포

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # 수동 트리거 허용

env:
  NODE_VERSION: '20'
  SKIP_ENV_VALIDATION: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: 배포 전 검증
  # ═══════════════════════════════════════════════════════════════
  validate:
    name: 🔍 배포 전 검증
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Vercel 배포
  # ═══════════════════════════════════════════════════════════════
  deploy-vercel:
    name: 🚀 Vercel 배포
    needs: validate
    runs-on: ubuntu-latest
    # VERCEL_TOKEN이 설정된 경우에만 실행
    if: ${{ vars.DEPLOY_TO_VERCEL == 'true' || secrets.VERCEL_TOKEN != '' }}

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 배포 완료 알림
        run: |
          echo "✅ 배포가 완료되었습니다!"
          echo "URL: ${{ steps.deploy.outputs.url }}"

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Railway 배포 (대안)
  # ═══════════════════════════════════════════════════════════════
  deploy-railway:
    name: 🚂 Railway 배포
    needs: validate
    runs-on: ubuntu-latest
    # RAILWAY_TOKEN이 설정된 경우에만 실행
    if: ${{ vars.DEPLOY_TO_RAILWAY == 'true' && secrets.RAILWAY_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # Job 4: 배포 성공/실패 알림
  # ═══════════════════════════════════════════════════════════════
  notify:
    name: 📢 배포 알림
    needs: [validate, deploy-vercel]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: 배포 성공 알림
        if: ${{ needs.deploy-vercel.result == 'success' && secrets.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "배포 성공"
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** main
            **Commit:** ${{ github.sha }}
          color: 0x00ff00

      - name: 배포 실패 알림
        if: ${{ failure() && secrets.DISCORD_WEBHOOK != '' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "배포 실패"
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** main
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
          color: 0xff0000
